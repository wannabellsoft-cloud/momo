name: Generate Momo voice clips

# Renders Momo's lines (app/src/lib/voice-lines.ts) with a Thai neural voice and commits
# app/public/voice/*.mp3, so Momo sounds the same on every device (iPhone web apps can't use Siri voices).
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "edge-tts voice"
        default: "th-TH-PremwadeeNeural"
      pitch:
        description: "pitch, e.g. +22Hz"
        default: "+22Hz"
      rate:
        description: "rate, e.g. +0%"
        default: "+0%"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: node scripts/gen-voice.mts
        env:
          MOMO_VOICE: ${{ inputs.voice }}
          MOMO_PITCH: ${{ inputs.pitch }}
          MOMO_RATE: ${{ inputs.rate }}
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voice
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Momo voice clips (${{ inputs.voice }}, ${{ inputs.pitch }})"
          git push
